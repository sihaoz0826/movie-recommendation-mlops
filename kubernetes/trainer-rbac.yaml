apiVersion: v1
kind: ServiceAccount
metadata:
  name: trainer-serviceaccount
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: trainer-role
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "patch", "list"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["list", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: trainer-rolebinding
subjects:
- kind: ServiceAccount
  name: trainer-serviceaccount
  namespace: default
roleRef:
  kind: Role
  name: trainer-role
  apiGroup: rbac.authorization.k8s.io

