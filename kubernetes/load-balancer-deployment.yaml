apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-balancer-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: load-balancer
  template:
    metadata:
      labels:
        app: load-balancer
    spec:
      containers:
      - name: load-balancer
        image: sihaoz826/movie_load_balancer:latest
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: INFERENCE_1_SERVICE
          value: "inference-1-service"
        - name: INFERENCE_2_SERVICE
          value: "inference-2-service"
        - name: INFERENCE_1_WEIGHT
          value: "80"  # 80% traffic to stable version
        - name: INFERENCE_2_WEIGHT
          value: "20"  # 20% traffic to canary version
        - name: AZURE_SERVER
          valueFrom:
            secretKeyRef:
              name: azure-db-secret
              key: AZURE_SERVER
        - name: AZURE_DATABASE
          valueFrom:
            secretKeyRef:
              name: azure-db-secret
              key: AZURE_DATABASE
        - name: AZURE_USERNAME
          valueFrom:
            secretKeyRef:
              name: azure-db-secret
              key: AZURE_USERNAME
        - name: AZURE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: azure-db-secret
              key: AZURE_PASSWORD
        - name: ENABLE_DB_LOGGING
          value: "true"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 5"]
---
apiVersion: v1
kind: Service
metadata:
  name: load-balancer-service
spec:
  type: NodePort
  selector:
    app: load-balancer
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    nodePort: 30080

