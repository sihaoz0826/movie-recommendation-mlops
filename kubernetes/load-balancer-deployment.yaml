apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-balancer-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: load-balancer
  template:
    metadata:
      labels:
        app: load-balancer
    spec:
      containers:
      - name: load-balancer
        image: sihaoz826/movie_load_balancer:latest
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: INFERENCE_1_SERVICE
          value: "inference-1-service"
        - name: INFERENCE_2_SERVICE
          value: "inference-2-service"
        - name: INFERENCE_1_WEIGHT
          value: "80"  # 80% traffic to stable version
        - name: INFERENCE_2_WEIGHT
          value: "20"  # 20% traffic to canary version
        - name: AZURE_SERVER
          valueFrom:
            secretKeyRef:
              name: azure-db-secret
              key: AZURE_SERVER
        - name: AZURE_DATABASE
          valueFrom:
            secretKeyRef:
              name: azure-db-secret
              key: AZURE_DATABASE
        - name: AZURE_USERNAME
          valueFrom:
            secretKeyRef:
              name: azure-db-secret
              key: AZURE_USERNAME
        - name: AZURE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: azure-db-secret
              key: AZURE_PASSWORD
        - name: ENABLE_DB_LOGGING
          value: "true"
        # Online hit@3: same movielog1 broker as the ratings consumer. The window is how long
        # a served top-3 stays eligible. The consumer group defaults to
        # load-balancer-online-hit-<pod hostname> so this pod does not join the
        # evaluation-monitor or ratings groups, and so a second balancer replica
        # (pending recs are in-process) still sees every watch.
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "172.206.116.1:9092"
        - name: KAFKA_TOPIC
          value: "movielog1"
        - name: ONLINE_HIT_ENABLED
          value: "true"
        - name: ONLINE_HIT_WINDOW_SECONDS
          value: "1800"
        - name: ONLINE_HIT_MAX_PENDING
          value: "300000"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 5"]
---
apiVersion: v1
kind: Service
metadata:
  name: load-balancer-service
spec:
  type: NodePort
  selector:
    app: load-balancer
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    nodePort: 30080

