apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-api-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard-api
  template:
    metadata:
      labels:
        app: dashboard-api
    spec:
      containers:
      - name: dashboard-api
        image: sihaoz826/movie_dashboard:latest
        ports:
        - containerPort: 8086
          name: http
        env:
        - name: PORT
          value: "8086"
        - name: AZURE_SERVER
          valueFrom:
            secretKeyRef:
              name: azure-db-secret
              key: AZURE_SERVER
        - name: AZURE_DATABASE
          valueFrom:
            secretKeyRef:
              name: azure-db-secret
              key: AZURE_DATABASE
        - name: AZURE_USERNAME
          valueFrom:
            secretKeyRef:
              name: azure-db-secret
              key: AZURE_USERNAME
        - name: AZURE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: azure-db-secret
              key: AZURE_PASSWORD
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8086
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8086
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-api-service
spec:
  type: NodePort
  selector:
    app: dashboard-api
  ports:
  - name: http
    port: 8086
    targetPort: 8086
    nodePort: 30086

