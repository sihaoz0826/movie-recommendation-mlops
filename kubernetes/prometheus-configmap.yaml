apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        monitor: 'kubernetes-movie-recommender'
        cluster: 'default'

    scrape_configs:
      # Scrape Prometheus itself
      - job_name: 'prometheus'
        scrape_interval: 5s
        static_configs:
          - targets: ['localhost:9090']

      # Scrape evaluation monitors using Kubernetes pod discovery
      - job_name: 'evaluation-monitor'
        scrape_interval: 15s
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - default
        relabel_configs:
          # Only scrape pods with app=evaluation-monitor label
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: evaluation-monitor
          # Use pod IP and port 8084
          - source_labels: [__meta_kubernetes_pod_ip]
            action: replace
            target_label: __address__
            replacement: ${1}:8084
          # Add useful labels to distinguish instances
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod_name
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
          - source_labels: [__meta_kubernetes_pod_label_instance]
            target_label: inference_instance

      # Scrape load balancer latency, status, and online hit@3 counters (app port 8080)
      - job_name: 'load-balancer'
        scrape_interval: 15s
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - default
        relabel_configs:
          # Only scrape pods with app=load-balancer label
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: load-balancer
          # Use pod IP and container port 8080
          - source_labels: [__meta_kubernetes_pod_ip]
            action: replace
            target_label: __address__
            replacement: ${1}:8080
          # Add useful labels to distinguish instances
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod_name
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app

