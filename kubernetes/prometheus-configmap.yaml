apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        monitor: 'kubernetes-movie-recommender'
        cluster: 'default'

    scrape_configs:
      # Scrape Prometheus itself
      - job_name: 'prometheus'
        scrape_interval: 5s
        static_configs:
          - targets: ['localhost:9090']

      # Scrape evaluation monitors using Kubernetes pod discovery
      - job_name: 'evaluation-monitor'
        scrape_interval: 15s
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - default
        relabel_configs:
          # Only scrape pods with app=evaluation-monitor label
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: evaluation-monitor
          # Use pod IP and port 8084
          - source_labels: [__meta_kubernetes_pod_ip]
            action: replace
            target_label: __address__
            replacement: ${1}:8084
          # Add useful labels to distinguish instances
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod_name
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
          - source_labels: [__meta_kubernetes_pod_label_instance]
            target_label: inference_instance

      # Scrape inference services (health endpoints)
      - job_name: 'inference-1'
        scrape_interval: 15s
        kubernetes_sd_configs:
          - role: service
            namespaces:
              names:
                - default
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: inference-1-service
          - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_service_port_name]
            action: replace
            target_label: __address__
            regex: (.+);(.+)
            replacement: ${1}:8083

      - job_name: 'inference-2'
        scrape_interval: 15s
        kubernetes_sd_configs:
          - role: service
            namespaces:
              names:
                - default
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: inference-2-service
          - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_service_port_name]
            action: replace
            target_label: __address__
            regex: (.+);(.+)
            replacement: ${1}:8083

