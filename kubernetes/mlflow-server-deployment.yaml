apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow-server
  labels:
    app: mlflow-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow-server
  template:
    metadata:
      labels:
        app: mlflow-server
    spec:
      initContainers:
      - name: create-mlflow-db-dir
        image: busybox
        command: ['sh', '-c', 'mkdir -p /shared-volume/mlflow-db && chmod 777 /shared-volume/mlflow-db']
        volumeMounts:
        - name: model-volume
          mountPath: /shared-volume
      containers:
      - name: mlflow-server
        image: sihaoz826/movie_mlflow:latest
        command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000", "--serve-artifacts"]
        ports:
        - containerPort: 5000
          name: mlflow
        env:
        - name: MLFLOW_BACKEND_STORE_URI
          value: "sqlite:///shared-volume/mlflow-db/mlflow.db"
        - name: MLFLOW_DEFAULT_ARTIFACT_ROOT
          value: "wasbs://mlflow-artifacts@movierecommendations.blob.core.windows.net/"
        - name: AZURE_STORAGE_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: azure-blob-secret
              key: connectionstring
        volumeMounts:
        - name: model-volume
          mountPath: /shared-volume
        resources:
          requests:
            cpu: "100m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: model-volume
        persistentVolumeClaim:
          claimName: model-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow-service
  labels:
    app: mlflow-server
spec:
  type: NodePort
  selector:
    app: mlflow-server
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30050
    name: mlflow

