apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: inference-2-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: inference-2-deployment
  minReplicas: 1
  maxReplicas: 2
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70  # Scale up when CPU > 70% of request
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 30  # Wait 5 min before scaling down
      policies:
      - type: Percent
        value: 50  # Scale down by max 50% at a time
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0  # Scale up immediately
      policies:
      - type: Percent
        value: 100  # Can double pods at once
        periodSeconds: 15
      - type: Pods
        value: 2  # Or add 2 pods at once
        periodSeconds: 15
      selectPolicy: Max  # Use the more aggressive policy
